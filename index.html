<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thhy3 | Accs</title>
    <!-- Google Font & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #050508;
            color: #ffffff;
            overflow-x: hidden;
            position: relative;
        }

        /* Cinematic Background - Reduced Blur to 25% (2px) */
        .background-overlay {
            position: fixed;
            top: -10%;
            left: -10%;
            width: 120vw;
            height: 120vh;
            z-index: 0;
            background-image: url('backround.jpg'); 
            background-size: cover;
            background-position: center;
            filter: blur(2px) brightness(0.55) contrast(1.15);
            animation: slowZoom 25s infinite alternate ease-in-out;
        }

        @keyframes slowZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        /* Cinematic Vignette & Lighting Gradients */
        .cinematic-vignette {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 1;
            pointer-events: none;
            background: 
                radial-gradient(circle at center, transparent 35%, rgba(0, 0, 0, 0.8) 100%),
                linear-gradient(to bottom, rgba(0,0,0,0.5) 0%, transparent 40%, rgba(0,0,0,0.6) 100%);
        }

        /* Floating Ember Particles Canvas */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        /* Card Container */
        .card-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 780px;
            padding: 20px;
            animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .card { 
            background: rgba(14, 16, 24, 0.65);
            padding: 40px; 
            border-radius: 28px; 
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.85),
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 40px;
            align-items: center;
        }

        /* LEFT COLUMN: Profile & Name */
        .left-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            border-right: 1px solid rgba(255, 255, 255, 0.12);
            padding-right: 40px;
            height: 100%;
        }

        .pfp-wrapper {
            position: relative;
            width: 130px;
            height: 130px;
            margin-bottom: 16px;
            border-radius: 50%;
            background: linear-gradient(135deg, #fe2c55, #ff8e53, #5865F2);
            padding: 3px;
            box-shadow: 0 0 30px rgba(254, 44, 85, 0.35);
        }

        .pfp { 
            width: 100%;
            height: 100%;
            border-radius: 50%; 
            object-fit: cover;
            display: block;
            background: #111;
        }

        h2 { 
            font-size: 1.9rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        /* RIGHT COLUMN: Links */
        .right-column {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-group {
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .btn { 
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 14px;
            padding: 14px 20px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            color: #ffffff;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            cursor: pointer;
            z-index: 2;
        }

        .btn i {
            font-size: 1.2rem;
            width: 20px;
            text-align: center;
        }

        /* Connected Preview Boxes */
        .connected-box {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            background: rgba(8, 10, 15, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-top: none;
            border-radius: 0 0 14px 14px;
            margin-top: -6px;
            padding: 0 16px;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 1;
        }

        .connected-pfp {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.2);
            flex-shrink: 0;
        }

        .connected-info {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .connected-info .display-name {
            font-weight: 800;
            font-size: 0.9rem;
            color: #ffffff;
            line-height: 1.2;
        }

        .connected-info .username {
            font-size: 0.78rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .connected-info .stats {
            font-size: 0.72rem;
            color: #ff4b72;
            font-weight: 600;
            margin-top: 2px;
        }

        .link-group:hover .connected-box,
        .link-group:focus-within .connected-box {
            max-height: 80px;
            opacity: 1;
            padding: 12px 16px;
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
        }

        .link-group:hover .btn,
        .link-group:focus-within .btn {
            border-bottom-left-radius: 0;
            border-bottom-right-radius: 0;
            transform: translateY(-2px);
        }

        /* Buttons */
        .tiktok { 
            background: rgba(254, 44, 85, 0.15); 
            border-color: rgba(254, 44, 85, 0.3);
            color: #ff4b72;
        }
        .link-group:hover .tiktok {
            background: #fe2c55;
            color: #ffffff;
            box-shadow: 0 0 25px rgba(254, 44, 85, 0.5);
        }

        .discord { 
            background: rgba(88, 101, 242, 0.15); 
            border-color: rgba(88, 101, 242, 0.3);
            color: #7289da;
        }
        .link-group:hover .discord {
            background: #5865F2;
            color: #ffffff;
            box-shadow: 0 0 25px rgba(88, 101, 242, 0.5);
        }

        .mc-btn { 
            background: rgba(46, 125, 50, 0.18); 
            border-color: rgba(76, 175, 80, 0.3);
            color: #66bb6a;
        }
        .link-group:hover .mc-btn {
            background: #388e3c;
            color: #ffffff;
            box-shadow: 0 0 25px rgba(56, 142, 60, 0.5);
        }

        .vote-btn { 
            background: linear-gradient(135deg, #fe2c55 0%, #ff7043 100%);
            border: none;
            color: #ffffff;
            margin-top: 4px;
            box-shadow: 0 6px 20px rgba(254, 44, 85, 0.35);
        }
        .vote-btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 10px 30px rgba(254, 44, 85, 0.6);
            filter: brightness(1.1);
        }

        .footer-text {
            font-size: 0.78rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.45);
            margin-top: 6px;
            text-align: center;
        }

        /* Mobile Responsive */
        @media (max-width: 600px) {
            .card {
                grid-template-columns: 1fr;
                gap: 24px;
                padding: 30px 20px;
            }
            .left-column {
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
                padding-right: 0;
                padding-bottom: 24px;
            }
        }
    </style>
</head>
<body>

    <!-- Background Elements -->
    <div class="background-overlay"></div>
    <div class="cinematic-vignette"></div>
    <canvas id="particles-canvas"></canvas>

    <div class="card-container">
        <div class="card">
            
            <!-- LEFT SIDE: Profile + Name -->
            <div class="left-column">
                <div class="pfp-wrapper">
                    <img src="pfp.jpg" alt="Profile Image" class="pfp">
                </div>
                <h2>Thhy3</h2>
            </div>

            <!-- RIGHT SIDE: Links -->
            <div class="right-column">
                
                <!-- TikTok -->
                <div class="link-group">
                    <a href="https://www.tiktok.com/@muhhehehehe0" target="_blank" class="btn tiktok">
                        <i class="fa-brands fa-tiktok"></i> TikTok
                    </a>
                    <div class="connected-box">
                        <img src="tiktokpfp.png" alt="TikTok Profile" class="connected-pfp">
                        <div class="connected-info">
                            <span class="display-name">Balazs</span>
                            <span class="username">@muhhehehehe0</span>>
                        </div>
                    </div>
                </div>

                <!-- Discord -->
                <div class="link-group">
                    <a href="https://discord.com/users/1506261839946977290" target="_blank" class="btn discord">
                        <i class="fa-brands fa-discord"></i> Discord
                    </a>
                    <div class="connected-box">
                        <img src="pfp.jpg" alt="Discord Profile" class="connected-pfp">
                        <div class="connected-info">
                            <span class="display-name">Thhy3</span>
                            <span class="username">ID: 1506261839946977290</span>
                        </div>
                    </div>
                </div>

                <!-- Minecraft -->
                <div class="link-group">
                    <a href="https://laby.net/@Thhy3" target="_blank" class="btn mc-btn">
                        <i class="fa-solid fa-cube"></i> Mc Account
                    </a>
                    <div class="connected-box">
                        <img src="https://mc-heads.net/avatar/Thhy3/42" alt="MC Avatar" class="connected-pfp">
                        <div class="connected-info">
                            <span class="display-name">Thhy3</span>
                            <span class="username">Laby.net Profile</span>
                        </div>
                    </div>
                </div>

                <!-- Vote Button -->
                <a href="https://forms.gle/ALPbR8ZDAH3aUvtm9" target="_blank" class="btn vote-btn">
                    <i class="fa-solid fa-thumbs-up"></i> Vote & Like My Page
                </a>
                
                <p class="footer-text">I'll see your username when you vote!</p>
            </div>

        </div>
    </div>

    <!-- Floating Particles -->
    <script>
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const particles = [];
        const particleCount = 45;

        class Ember {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + Math.random() * 50;
                this.size = Math.random() * 2.5 + 0.8;
                this.speedY = Math.random() * 1.2 + 0.3;
                this.speedX = (Math.random() - 0.5) * 0.6;
                this.opacity = Math.random() * 0.7 + 0.3;
                this.color = Math.random() > 0.5 ? '#ff7043' : '#fe2c55';
            }

            update() {
                this.y -= this.speedY;
                this.x += this.speedX;
                this.opacity -= 0.002;

                if (this.y < -10 || this.opacity <= 0) {
                    this.reset();
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.opacity;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;
            }
        }

        for (let i = 0; i < particleCount; i++) {
            particles.push(new Ember());
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
